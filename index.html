<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1b16">
  <meta name="description" content="Mahjong — a polished, relaxing solitaire tile-matching game.">
  <title>Mahjong Solitaire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">萬</div><div><div class="brand-name">MAHJONG</div><div class="brand-sub">Solitaire</div></div></div>
      <div class="stats" aria-live="polite">
        <div><span>TIME</span><strong id="time">00:00</strong></div>
        <div><span>MOVES</span><strong id="moves">0</strong></div>
        <div><span>PAIRS</span><strong id="pairs">0 / 72</strong></div>
      </div>
      <button class="icon-btn" id="soundBtn" aria-label="Toggle sound">🔊</button>
    </header>

    <main>
      <section class="hero">
        <div>
          <p class="eyebrow">A quiet moment of focus</p>
          <h1>Clear the board.<br><em>Find your rhythm.</em></h1>
        </div>
        <div class="actions"><button class="btn secondary" id="newGame">New game</button><button class="btn primary" id="hint">Hint <kbd>H</kbd></button></div>
      </section>

      <section class="game-card">
        <div class="board-wrap"><div id="board" class="board" role="grid" aria-label="Mahjong game board"></div><div id="message" class="message hidden"></div></div>
        <div class="bottom-bar">
          <div class="tip"><span class="tip-dot"></span><span id="tipText">Match identical open tiles. Flowers and seasons match within their family.</span></div>
          <button class="text-btn" id="shuffle">Shuffle remaining <span>↻</span></button>
        </div>
      </section>
    </main>

    <footer><span>Mahjong Solitaire</span><span>Built for the web · No account required</span></footer>
  </div>
  <div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-icon">✦</div><p class="eyebrow" id="modalEyebrow">Board cleared</p><h2 id="modalTitle">Beautifully done.</h2><p id="modalCopy"></p><div class="modal-stats"><div><span>TIME</span><strong id="finalTime">00:00</strong></div><div><span>MOVES</span><strong id="finalMoves">0</strong></div></div><button class="btn primary full" id="playAgain">Play again</button></div></div>
  <script src="game.js"></script>
</body>
</html>
