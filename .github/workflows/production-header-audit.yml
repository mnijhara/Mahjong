name: Production Header Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  production-header-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate production headers and cache rules
        run: node scripts/production-header-audit.js
