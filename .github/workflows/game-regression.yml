name: Mahjong Game Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TEST_VERSION: american-strategy-engine-v1

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0 --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate American strategy engine
        run: |
          node --check american-card-engine.js
          node - <<'NODE'
          const fs = require('fs'); const vm = require('vm'); const context = { window: {} }; vm.createContext(context); vm.runInContext(fs.readFileSync('american-card-engine.js', 'utf8'), context);
          const hand = [{type:'suited',suit:'craks',value:2,label:'2 Crak'},{type:'suited',suit:'craks',value:4,label:'4 Crak'},{type:'suited',suit:'craks',value:6,label:'6 Crak'},{type:'suited',suit:'craks',value:6,label:'6 Crak'},{type:'suited',suit:'craks',value:6,label:'6 Crak'},{type:'suited',suit:'craks',value:8,label:'8 Crak'},{type:'joker',label:'Joker'},{type:'wind',key:'east',label:'East Wind'},{type:'wind',key:'west',label:'West Wind'},{type:'dragon',key:'red',label:'Red Dragon'},{type:'suited',suit:'dots',value:3,label:'3 Dot'},{type:'suited',suit:'dots',value:5,label:'5 Dot'},{type:'suited',suit:'dots',value:7,label:'7 Dot'},{type:'suited',suit:'dots',value:9,label:'9 Dot'}];
          const result = context.window.americanCardEngine.analyze(hand); if (result.length !== 9) throw new Error(`Expected 9 candidate families, got ${result.length}`); if (!result.every(x => Number.isFinite(x.score) && x.score >= 0 && x.score <= 100)) throw new Error('Candidate scores are invalid'); if (!result.some(x => x.id === '2468')) throw new Error('2468 family missing'); if (!result.some(x => x.id === 'quints')) throw new Error('Quints family missing'); if (!result.some(x => x.id === 'run')) throw new Error('Consecutive Run family missing'); console.log('American strategy engine validation passed');
          NODE
      - name: Start static server and wait for readiness
        run: |
          python3 -m http.server 4173 >/tmp/mahjong-server.log 2>&1 &
          for i in {1..20}; do if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/mahjong-server.log; exit 1
      - name: Exercise American and Solitaire browser paths
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:900}}); const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)}); page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
            if(await page.locator('#gameStyle').inputValue()!=='american')throw new Error('American mode is not the default');
            if(await page.locator('#americanHand .american-tile').count()!==0)throw new Error('American hand should not auto-start');
            await page.locator('#americanStart').click(); if(await page.locator('#americanHand .american-tile').count()!==14)throw new Error('American Start game did not deal 14 tiles');
            if(!(await page.locator('#americanStatus').textContent()).includes('Charleston'))throw new Error('American Charleston did not start');
            for(let attempt=0;attempt<12&&await page.locator('#americanCombinations .american-combo-card').count()<1;attempt++){await page.locator('#americanStart').click();await page.waitForTimeout(20)}
            const insightCards=await page.locator('#americanCombinations .american-combo-card').count(); const insightEmpty=await page.locator('#americanCombinations .american-insight-empty').count();
            if(insightCards<1&&insightEmpty<1)throw new Error('American hand guidance did not render'); if(await page.locator('#americanDirections .american-direction-card').count()!==4)throw new Error('American candidate ranking did not render'); if(await page.locator('#americanDirections .american-direction-card.recommended').count()!==1)throw new Error('Recommended candidate missing');
            await page.locator('#americanSuggested').click(); if(!await page.locator('#americanInsights').isVisible())throw new Error('Live Suggested Hands panel did not open');
            if(insightCards>0){await page.locator('#americanCombinations .american-combo-card').first().click();if(await page.locator('#americanHand .american-tile.insight-focus').count()<1)throw new Error('Combination card did not highlight tiles')}
            for(let pass=0;pass<3;pass++){const indexes=await page.locator('#americanHand .american-tile').evaluateAll(els=>els.map((el,index)=>({index,joker:/Joker/i.test(el.getAttribute('aria-label')||'')})).filter(x=>!x.joker).slice(0,3).map(x=>x.index));for(const index of indexes.slice().reverse())await page.locator('#americanHand .american-tile').nth(index).click();if(await page.locator('#americanPass').isDisabled())throw new Error(`Charleston pass ${pass+1} did not enable`);await page.locator('#americanPass').click()}
            if(!(await page.locator('#americanStatus').textContent()).includes('Charleston complete'))throw new Error('Charleston did not complete');
            await page.selectOption('#gameStyle','solitaire'); await page.getByRole('button',{name:'Start game'}).click(); if(await page.locator('#board .tile').count()!==144)throw new Error('Expected 144 Solitaire tiles');
            const openTile=page.locator('#board .tile.free').first(); await openTile.click(); if(await page.locator('#board .tile.selected').count()!==1)throw new Error('Solitaire selection failed'); await page.getByRole('button',{name:/Undo/}).click(); if(await page.locator('#board .tile.selected').count()!==0)throw new Error('Solitaire undo failed');
            await page.getByRole('button',{name:/Hint/}).click(); await page.waitForTimeout(800); const hint=await page.locator('#board .tile.selected').getAttribute('data-order'); if(!hint)throw new Error('Hint failed'); await page.locator(`[data-order="${hint}"]`).click(); if(await page.locator('#board .tile').count()!==142)throw new Error('Hint pair did not remove two tiles');
            if(!(await page.evaluate(()=>Boolean(localStorage.getItem('mahjong-solitaire-save-v1')))))throw new Error('Solitaire save missing');
            await page.reload({waitUntil:'networkidle'}); await page.selectOption('#gameStyle','solitaire'); await page.getByRole('button',{name:/Resume game|Start game/}).click(); if(await page.locator('#board .tile').count()!==142)throw new Error('Saved Solitaire board did not restore');
            await page.getByRole('button',{name:/Shuffle remaining/}).click(); for(let run=0;run<10;run++){await page.getByRole('button',{name:/Shuffle remaining/}).click();await page.getByRole('button',{name:/Hint/}).click();await page.waitForTimeout(100);if(await page.locator('#board .tile.selected').count()!==1)throw new Error(`Shuffle ${run+1} left no legal hint`);await page.locator('#board .tile.selected').click()}
            await page.setViewportSize({width:390,height:844}); await page.reload({waitUntil:'networkidle'}); await page.selectOption('#gameStyle','american'); await page.locator('#americanStart').click(); if(await page.locator('#americanHand .american-tile').count()!==14)throw new Error('Mobile American Start game failed'); if(await page.locator('#americanDirections .american-direction-card').count()!==4)throw new Error('Mobile American candidate ranking failed');
            await page.selectOption('#gameStyle','solitaire'); await page.getByRole('button',{name:/Resume game|Start game/}).click(); if(await page.locator('#board .tile').count()!==142)throw new Error('Mobile Solitaire resume failed'); if(errors.length)throw new Error(errors.join('\n')); await browser.close(); console.log(`American + Solitaire browser regression passed (${process.env.TEST_VERSION})`);
          })().catch(e=>{console.error(e);process.exit(1)}); NODE
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/mahjong-server.log || true
