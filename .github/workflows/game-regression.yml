name: Mahjong Game Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0 --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server and wait for readiness
        run: |
          python3 -m http.server 4173 >/tmp/mahjong-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mahjong-server.log
          exit 1
      - name: Exercise American and Solitaire browser paths
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:900}});
            const errors = [];
            page.on('console', msg => { if (msg.type() === 'error') errors.push(`console: ${msg.text()}`); });
            page.on('pageerror', err => errors.push(`pageerror: ${err.message}`));
            await page.goto('http://127.0.0.1:4173/index.html', {waitUntil:'networkidle'});

            if (await page.locator('#gameStyle').inputValue() !== 'american') throw new Error('American mode is not the default');
            if (await page.locator('#americanHand .american-tile').count() !== 0) throw new Error('American hand should not auto-start');
            if (await page.locator('#americanStart').count() !== 1) throw new Error('American Start game control is missing');
            await page.locator('#americanStart').click();
            if (await page.locator('#americanHand .american-tile').count() !== 14) throw new Error('American Start game did not deal 14 tiles');
            if (!(await page.locator('#americanStatus').textContent()).includes('Charleston')) throw new Error('American Charleston did not start');
            for (let pass = 0; pass < 3; pass++) {
              const tiles = page.locator('#americanHand .american-tile');
              await tiles.nth(0).click(); await tiles.nth(1).click(); await tiles.nth(2).click();
              if (await page.locator('#americanPass').isDisabled()) throw new Error(`Charleston pass ${pass + 1} did not enable`);
              await page.locator('#americanPass').click();
            }
            if (!(await page.locator('#americanStatus').textContent()).includes('Charleston complete')) throw new Error('Charleston did not complete');
            if (await page.locator('#americanHand .american-tile').count() !== 14) throw new Error('East hand count changed after Charleston');

            await page.selectOption('#gameStyle', 'solitaire');
            await page.getByRole('button', {name:'Start game'}).click();
            if (await page.locator('#board .tile').count() !== 144) throw new Error('Expected 144 Solitaire tiles');
            if (await page.locator('#board .tile.free').count() < 1) throw new Error('No open Solitaire tile rendered');
            const openTile = page.locator('#board .tile.free').first();
            const label = await openTile.getAttribute('aria-label');
            if (!label || !label.includes('open')) throw new Error('Open Solitaire tile missing accessible state');
            await openTile.click();
            if (await page.locator('#board .tile.selected').count() !== 1) throw new Error('Solitaire tile selection failed');
            await page.getByRole('button', {name:/Undo/}).click();
            if (await page.locator('#board .tile.selected').count() !== 0) throw new Error('Solitaire undo failed');
            await page.getByRole('button', {name:/Hint/}).click();
            await page.waitForTimeout(150);
            if (await page.locator('#board .tile.selected').count() < 1) throw new Error('Solitaire hint failed');
            await page.getByRole('button', {name:/Shuffle remaining/}).click();
            if (await page.locator('#board .tile').count() !== 144) throw new Error('Solitaire shuffle changed tile count');

            const freePair = async () => {
              const items = await page.locator('#board .tile.free').evaluateAll(els => els.map(el => ({
                order: el.dataset.order,
                label: el.getAttribute('aria-label') || '',
                category: el.querySelector('.small')?.textContent || ''
              })));
              const groups = new Map();
              for (const item of items) {
                const base = item.label.replace(/ tile,? (open|blocked)$/, '');
                const key = item.category === '花' || item.category === '季' ? item.category : base;
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(item);
              }
              for (const group of groups.values()) if (group.length >= 2) return group.slice(0, 2);
              return null;
            };

            const solveCurrentBoard = async () => {
              for (let move = 0; move < 72; move++) {
                const pair = await freePair();
                if (!pair) throw new Error(`No matching open pair after ${move} moves`);
                await page.locator(`[data-order="${pair[0].order}"]`).click();
                await page.locator(`[data-order="${pair[1].order}"]`).click();
                const remaining = await page.locator('#board .tile').count();
                if (remaining !== 144 - ((move + 1) * 2)) throw new Error(`Unexpected tile count after move ${move + 1}: ${remaining}`);
              }
              if (await page.locator('#board .tile').count() !== 0) throw new Error('Shuffled Solitaire board did not clear');
              if (await page.locator('#modal').evaluate(el => el.classList.contains('hidden'))) throw new Error('Completion modal did not open');
              await page.getByRole('button', {name:/Play again/}).click();
            };

            // The shuffle implementation must produce a board that is not merely pair-preserving,
            // but actually solvable from the current geometry. Repeat with fresh random boards.
            for (let run = 0; run < 5; run++) {
              if (await page.locator('#board .tile').count() !== 144) throw new Error(`Run ${run + 1} did not start with 144 tiles`);
              await page.getByRole('button', {name:/Shuffle remaining/}).click();
              await solveCurrentBoard();
            }

            await page.setViewportSize({width:390,height:844});
            await page.reload({waitUntil:'networkidle'});
            await page.locator('#americanStart').click();
            if (await page.locator('#americanHand .american-tile').count() !== 14) throw new Error('Mobile American Start game did not deal 14 tiles');
            await page.selectOption('#gameStyle', 'solitaire');
            await page.getByRole('button', {name:'Start game'}).click();
            if (await page.locator('#board .tile').count() !== 144) throw new Error('Mobile Solitaire render failed');
            if (errors.length) throw new Error(errors.join('\n'));
            await browser.close();
            console.log('American explicit-start + Charleston + Solitaire shuffle-solvability + mobile browser regression passed');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/mahjong-server.log || true
