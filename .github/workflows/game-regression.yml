name: Mahjong Game Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TEST_VERSION: american-strategy-engine-v1

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0 --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate American strategy engine
        run: |
          node --check american-card-engine.js
          node - <<'NODE'
          const fs = require('fs'); const vm = require('vm'); const context = { window: {} }; vm.createContext(context); vm.runInContext(fs.readFileSync('american-card-engine.js', 'utf8'), context);
          const hand = [{type:'suited',suit:'craks',value:2,label:'2 Crak'},{type:'suited',suit:'craks',value:4,label:'4 Crak'},{type:'suited',suit:'craks',value:6,label:'6 Crak'},{type:'suited',suit:'craks',value:6,label:'6 Crak'},{type:'suited',suit:'craks',value:6,label:'6 Crak'},{type:'suited',suit:'craks',value:8,label:'8 Crak'},{type:'joker',label:'Joker'},{type:'wind',key:'east',label:'East Wind'},{type:'wind',key:'west',label:'West Wind'},{type:'dragon',key:'red',label:'Red Dragon'},{type:'suited',suit:'dots',value:3,label:'3 Dot'},{type:'suited',suit:'dots',value:5,label:'5 Dot'},{type:'suited',suit:'dots',value:7,label:'7 Dot'},{type:'suited',suit:'dots',value:9,label:'9 Dot'}];
          const result = context.window.americanCardEngine.analyze(hand); if (result.length !== 9) throw new Error(`Expected 9 candidate families, got ${result.length}`); if (!result.every(x => Number.isFinite(x.score) && x.score >= 0 && x.score <= 100)) throw new Error('Candidate scores are invalid'); if (!result.some(x => x.id === '2468')) throw new Error('2468 family missing'); if (!result.some(x => x.id === 'quints')) throw new Error('Quints family missing'); if (!result.some(x => x.id === 'run')) throw new Error('Consecutive Run family missing'); console.log('American strategy engine validation passed');
          NODE
      - name: Start static server and wait for readiness
        run: |
          nohup node scripts/static-server.js >/tmp/mahjong-server.log 2>&1 &
          for i in {1..30}; do if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi; sleep 0.5; done
          cat /tmp/mahjong-server.log; exit 1
      - name: Exercise American and Solitaire browser paths
        run: node scripts/browser-regression.js
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/mahjong-server.log || true
