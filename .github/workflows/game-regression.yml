name: Mahjong Game Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TEST_VERSION: persisted-solitaire-v1

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0 --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server and wait for readiness
        run: |
          python3 -m http.server 4173 >/tmp/mahjong-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mahjong-server.log
          exit 1
      - name: Exercise American and Solitaire browser paths
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:900}});
            const errors = [];
            page.on('console', msg => { if (msg.type() === 'error') errors.push(`console: ${msg.text()}`); });
            page.on('pageerror', err => errors.push(`pageerror: ${err.message}`));
            await page.goto('http://127.0.0.1:4173/index.html', {waitUntil:'networkidle'});

            if (await page.locator('#gameStyle').inputValue() !== 'american') throw new Error('American mode is not the default');
            if (await page.locator('#americanHand .american-tile').count() !== 0) throw new Error('American hand should not auto-start');
            if (await page.locator('#americanStart').count() !== 1) throw new Error('American Start game control is missing');
            await page.locator('#americanStart').click();
            if (await page.locator('#americanHand .american-tile').count() !== 14) throw new Error('American Start game did not deal 14 tiles');
            if (!(await page.locator('#americanStatus').textContent()).includes('Charleston')) throw new Error('American Charleston did not start');
            for (let attempt = 0; attempt < 12 && await page.locator('#americanCombinations .american-combo-card').count() < 1; attempt++) {
              await page.locator('#americanStart').click();
              await page.waitForTimeout(20);
            }
            const insightCards = await page.locator('#americanCombinations .american-combo-card').count();
            const insightEmpty = await page.locator('#americanCombinations .american-insight-empty').count();
            if (insightCards < 1 && insightEmpty < 1) throw new Error('American hand guidance did not render a card or empty-state explanation');
            if (insightCards > 0) {
              await page.locator('#americanCombinations .american-combo-card').first().click();
              if (await page.locator('#americanHand .american-tile.insight-focus').count() < 1) throw new Error('American combination card did not highlight its tiles');
            }
            for (let pass = 0; pass < 3; pass++) {
              const indexes = await page.locator('#americanHand .american-tile').evaluateAll((els) => els.map((el, index) => ({ index, joker: /Joker/i.test(el.getAttribute('aria-label') || '') })).filter(x => !x.joker).slice(0, 3).map(x => x.index));
              if (indexes.length < 3) throw new Error(`Not enough non-Joker tiles for Charleston pass ${pass + 1}`);
              for (const index of indexes.slice().reverse()) await page.locator('#americanHand .american-tile').nth(index).click();
              if (await page.locator('#americanPass').isDisabled()) throw new Error(`Charleston pass ${pass + 1} did not enable`);
              await page.locator('#americanPass').click();
            }
            if (!(await page.locator('#americanStatus').textContent()).includes('Charleston complete')) throw new Error('Charleston did not complete');
            if (await page.locator('#americanHand .american-tile').count() !== 14) throw new Error('East hand count changed after Charleston');

            await page.selectOption('#gameStyle', 'solitaire');
            await page.getByRole('button', {name:'Start game'}).click();
            if (await page.locator('#board .tile').count() !== 144) throw new Error('Expected 144 Solitaire tiles');
            if (await page.locator('#board .tile.free').count() < 1) throw new Error('No open Solitaire tile rendered');
            const openTile = page.locator('#board .tile.free').first();
            const label = await openTile.getAttribute('aria-label');
            if (!label || !label.includes('open')) throw new Error('Open Solitaire tile missing accessible state');
            await openTile.click();
            if (await page.locator('#board .tile.selected').count() !== 1) throw new Error('Solitaire tile selection failed');
            await page.getByRole('button', {name:/Undo/}).click();
            if (await page.locator('#board .tile.selected').count() !== 0) throw new Error('Solitaire undo failed');

            await page.getByRole('button', {name:/Hint/}).click();
            await page.waitForTimeout(100);
            const firstHintOrder = await page.locator('#board .tile.selected').getAttribute('data-order');
            if (!firstHintOrder) throw new Error('Hint did not select its first tile');
            await page.waitForTimeout(700);
            const secondHintOrder = await page.locator('#board .tile.selected').getAttribute('data-order');
            if (!secondHintOrder || secondHintOrder === firstHintOrder) throw new Error('Hint did not reveal its matching tile');
            await page.locator(`[data-order="${firstHintOrder}"]`).click();
            if (await page.locator('#board .tile').count() !== 142) throw new Error('Hint-selected pair did not remove two tiles');
            if ((await page.locator('#pairs').textContent()) !== '1 / 72') throw new Error('Pair counter did not increment');
            const savedBeforeReload = await page.evaluate(() => Boolean(localStorage.getItem('mahjong-solitaire-save-v1')));
            if (!savedBeforeReload) throw new Error('In-progress Solitaire game was not saved');

            await page.reload({waitUntil:'networkidle'});
            await page.selectOption('#gameStyle', 'solitaire');
            await page.getByRole('button', {name:/Resume game|Start game/}).click();
            if (await page.locator('#board .tile').count() !== 142) throw new Error('Saved Solitaire board did not restore after resume');
            if ((await page.locator('#pairs').textContent()) !== '1 / 72') throw new Error('Saved pair counter did not restore');
            if ((await page.locator('#startGame').textContent()).trim() !== 'Resume game') throw new Error('Resume game affordance missing');

            await page.getByRole('button', {name:/Shuffle remaining/}).click();
            if (await page.locator('#board .tile').count() !== 142) throw new Error('Solitaire shuffle changed tile count');
            for (let run = 0; run < 20; run++) {
              await page.getByRole('button', {name:/Shuffle remaining/}).click();
              await page.getByRole('button', {name:/Hint/}).click();
              await page.waitForTimeout(100);
              if (await page.locator('#board .tile.selected').count() !== 1) throw new Error(`Shuffle ${run + 1} left no legal hint`);
              await page.locator('#board .tile.selected').click();
              if (await page.locator('#board .tile.selected').count() !== 0) throw new Error(`Shuffle ${run + 1} selection did not clear`);
            }

            await page.setViewportSize({width:390,height:844});
            await page.reload({waitUntil:'networkidle'});
            await page.locator('#americanStart').click();
            if (await page.locator('#americanHand .american-tile').count() !== 14) throw new Error('Mobile American Start game did not deal 14 tiles');
            await page.selectOption('#gameStyle', 'solitaire');
            await page.getByRole('button', {name:/Resume game|Start game/}).click();
            if (await page.locator('#board .tile').count() !== 142) throw new Error('Mobile Solitaire saved-game resume failed');
            if (errors.length) throw new Error(errors.join('\n'));
            await browser.close();
            console.log(`American explicit-start + live combinations + clickable guidance + Charleston + Solitaire save/resume + shuffle recovery + mobile browser regression passed (${process.env.TEST_VERSION})`);
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/mahjong-server.log || true
