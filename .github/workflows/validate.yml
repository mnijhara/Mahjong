name: Validate Mahjong

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check game.js
      - name: Validate required web files
        run: |
          test -s index.html
          test -s styles.css
          test -s game.js
          grep -q 'id="board"' index.html
          grep -q 'id="startGame"' index.html
          grep -q 'id="undo"' index.html
          grep -q 'id="hint"' index.html
          grep -q 'id="shuffle"' index.html
          grep -q 'id="playAgain"' index.html
          grep -q '72 / 72\|/ 72' game.js index.html
      - name: Check for accidental secrets
        run: |
          if grep -RniE '\b(api[_-]?key|secret[_-]?key|private[_-]?key|password|access[_-]?token|auth[_-]?token)\b[[:space:]]*[:=][[:space:]]*["'"'][^"'"']{12,}["'"']' --exclude-dir=.git --exclude='*.md' .; then
            echo 'Potential credential-like content detected.'
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/mahjong-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/mahjong-server.log
          exit 1
      - name: Run browser smoke test
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:900}});
            await page.goto('http://127.0.0.1:4173/index.html', {waitUntil:'networkidle'});
            await page.getByRole('button', {name:'Start game'}).click();
            if (await page.locator('#board .tile').count() !== 144) throw new Error('Expected 144 tiles');
            if (await page.locator('#board .tile.free').count() < 1) throw new Error('No open tile rendered');
            const openTile = page.locator('#board .tile.free').first();
            const label = await openTile.getAttribute('aria-label');
            if (!label || !label.includes('open')) throw new Error('Open tile missing accessible state');
            await openTile.click();
            if (await page.locator('#board .tile.selected').count() !== 1) throw new Error('Tile selection failed');
            await page.getByRole('button', {name:/Undo/}).click();
            if (await page.locator('#board .tile.selected').count() !== 0) throw new Error('Undo failed');
            await page.getByRole('button', {name:/Hint/}).click();
            await page.waitForTimeout(150);
            if (await page.locator('#board .tile.selected').count() < 1) throw new Error('Hint failed');
            await page.getByRole('button', {name:/Shuffle remaining/}).click();
            if (await page.locator('#board .tile').count() !== 144) throw new Error('Shuffle changed tile count');
            await page.setViewportSize({width:390,height:844});
            await page.reload({waitUntil:'networkidle'});
            await page.getByRole('button', {name:'Start game'}).click();
            if (await page.locator('#board .tile').count() !== 144) throw new Error('Mobile render failed');
            await browser.close();
            console.log('Mahjong browser smoke test passed');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/mahjong-server.log || true
