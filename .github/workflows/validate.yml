name: Validate Mahjong

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TEST_VERSION: american-strategy-engine-v1

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run production build validation
        run: npm run build
      - name: Validate required web files
        run: |
          test -s index.html
          test -s styles.css
          test -s american.css
          test -s american-game.js
          test -s american-insights.js
          test -s game.js
          test -s solitaire-a11y.js
          test -s 404.html
          test -s .htaccess
          test -s scripts/static-server.js
          test -s manifest.webmanifest
          test -s robots.txt
          grep -q 'id="board"' index.html
          grep -q 'id="americanTable"' index.html
          grep -q 'id="americanHand"' index.html
          grep -q 'id="americanPass"' index.html
          grep -q 'id="americanCombinations"' index.html
          grep -q '72 / 72\|/ 72' game.js index.html
          grep -q 'solitaire-a11y.js' index.html
          grep -q 'ErrorDocument 404 /404.html' .htaccess
      - name: Check for accidental secrets
        run: |
          if grep -RniE '\b(api[_-]?key|secret[_-]?key|private[_-]?key|password|access[_-]?token|auth[_-]?token)\b[[:space:]]*[:=][[:space:]]*["'"'][^"'"']{12,}["'"']' --exclude-dir=.git --exclude-dir=.github --exclude='*.md' .; then
            echo 'Potential credential-like content detected.'
            exit 1
          fi
      - name: Check application content policy
        run: |
          if grep -niE 'my love|birthday|anniversary|dedication' index.html styles.css american.css american-game.js american-insights.js game.js style-selector.js solitaire-a11y.js manifest.webmanifest robots.txt 404.html .htaccess scripts/static-server.js; then
            echo 'Personal or occasion-specific content detected in application files.'
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0 --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          nohup node scripts/static-server.js >/tmp/mahjong-server.log 2>&1 &
          server_pid=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              echo "Static server ready after ${i} attempt(s)."
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Static server exited before becoming ready.'
              cat /tmp/mahjong-server.log
              exit 1
            fi
            sleep 0.5
          done
          echo 'Static server did not become ready within 15 seconds.'
          cat /tmp/mahjong-server.log
          exit 1
      - name: Verify static 404 fallback
        run: |
          status=$(curl --retry 5 --retry-delay 1 -s -o /tmp/mahjong-404.html -w '%{http_code}' http://127.0.0.1:4173/a-missing-game-route)
          test "$status" = "404"
          grep -qi 'Mahjong Solitaire' /tmp/mahjong-404.html
      - name: Run browser regression suite
        run: node scripts/browser-regression.js
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/mahjong-server.log || true
