name: American Mahjong UX Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ux-browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Static JavaScript validation
        run: |
          node --check american-ux.js
          node --check american-game.js
          node --check american-insights.js
          node --check style-selector.js
      - name: Browser UX regression
        run: |
          python3 -m http.server 4173 >/tmp/mahjong-server.log 2>&1 &
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const errors = [];
            const page = await browser.newPage({viewport:{width:390,height:844}, deviceScaleFactor:1});
            page.on('console', msg => { if (msg.type() === 'error') errors.push(`console: ${msg.text()}`); });
            page.on('pageerror', err => errors.push(`pageerror: ${err.message}`));
            await page.goto('http://127.0.0.1:4173/index.html', {waitUntil:'networkidle'});

            await page.locator('#americanSettings').evaluate(el => el.classList.add('open'));
            if (!await page.locator('#americanSettings').isVisible()) throw new Error('American settings panel did not open');
            await page.locator('#americanTileStyle').selectOption('jade');
            if (!(await page.locator('#tile-theme-style').textContent()).includes('#eef8f1')) throw new Error('American tile customization did not apply');
            if ((await page.evaluate(() => localStorage.getItem('mahjong-tile-theme'))) !== 'jade') throw new Error('Tile customization was not persisted');

            const tableView = page.locator('#tableView');
            if (await tableView.count() !== 1) throw new Error('Style section table view control is missing');
            await tableView.evaluate(el => { el.value = 'landscape'; el.dispatchEvent(new Event('change', {bubbles:true})); });
            if (!(await page.evaluate(() => document.body.classList.contains('preferred-landscape')))) throw new Error('Landscape selection did not activate');
            if ((await page.evaluate(() => localStorage.getItem('mahjong-table-view'))) !== 'landscape') throw new Error('Landscape preference was not persisted');

            await page.locator('#americanStart').click();
            if (await page.locator('#americanHand .american-tile').count() !== 14) throw new Error('American Start game did not deal 14 tiles');
            if (await page.locator('#americanPlayers .player-card').count() !== 4) throw new Error('American table did not render four players');
            if (await page.locator('#americanDirections .american-direction-card').count() !== 4) throw new Error('Suggested hand ranking did not render');
            await page.locator('#americanHint').click();
            if (await page.locator('#americanHand .american-tile.insight-focus').count() < 1) throw new Error('American Hint did not highlight a useful tile');

            await page.locator('#americanSuggested').click();
            if (await page.locator('#americanInsights').isVisible()) throw new Error('Suggested Hands control did not hide guidance');
            await page.locator('#americanSuggested').click();
            if (!await page.locator('#americanInsights').isVisible()) throw new Error('Suggested Hands control did not restore guidance');
            await page.locator('#americanDirections .american-direction-card').first().click();
            if (await page.locator('#americanHand .american-tile.insight-focus').count() < 1) throw new Error('Suggested hand card did not highlight supporting tiles');

            async function chooseThree() {
              const tiles = page.locator('#americanHand .american-tile');
              for (let i = 0; i < await tiles.count() && (await page.locator('#americanHand .american-tile.selected').count()) < 3; i++) {
                const label = await tiles.nth(i).getAttribute('aria-label');
                if (!label?.includes('Joker')) await tiles.nth(i).click();
              }
              if (await page.locator('#americanHand .american-tile.selected').count() !== 3) throw new Error('Could not select three Charleston tiles');
            }

            for (let pass = 0; pass < 3; pass++) {
              await chooseThree();
              await page.locator('#americanPass').click();
              if (pass < 2) await page.waitForTimeout(20);
            }
            if (await page.evaluate(() => window.americanGameState().phase) !== 'play') throw new Error('Charleston did not transition to play');
            if (await page.locator('#americanHand .american-tile').count() !== 14) throw new Error('Charleston did not preserve a 14-tile East hand');

            const wallBefore = await page.evaluate(() => window.americanGameState().wall);
            await page.locator('#americanHand .american-tile').first().click();
            await page.waitForTimeout(180);
            const stateAfter = await page.evaluate(() => window.americanGameState());
            if (stateAfter.phase !== 'play') throw new Error('Draw-discard play left play phase');
            if (stateAfter.hand !== 14) throw new Error(`Draw-discard cycle did not return East to 14 tiles: ${JSON.stringify(stateAfter)}`);
            if (stateAfter.wall !== wallBefore - 4) throw new Error(`Computer/human draw cycle consumed unexpected wall count: before ${wallBefore}, after ${stateAfter.wall}`);
            if (await page.locator('#americanDiscards .discard-tile').count() < 4) throw new Error('Discard area did not record the draw-discard cycle');
            if (await page.locator('#americanDirections .american-direction-card').count() !== 4) throw new Error('Suggested hands disappeared after gameplay');

            async function assertSingleViewport(label, p, width, height) {
              const metrics = await p.evaluate(() => {
                const doc = document.documentElement, body = document.body;
                const panel = document.querySelector('.american-panel');
                const rect = panel?.getBoundingClientRect();
                return { viewportW: innerWidth, viewportH: innerHeight, scrollW: Math.max(doc.scrollWidth, body.scrollWidth), scrollH: Math.max(doc.scrollHeight, body.scrollHeight), panel: rect ? {x:rect.x,y:rect.y,right:rect.right,bottom:rect.bottom,width:rect.width,height:rect.height} : null };
              });
              if (metrics.scrollW > width + 2) throw new Error(`${label}: horizontal page overflow ${JSON.stringify(metrics)}`);
              if (metrics.scrollH > height + 2) throw new Error(`${label}: vertical page overflow ${JSON.stringify(metrics)}`);
              if (!metrics.panel || metrics.panel.x < -1 || metrics.panel.right > width + 1 || metrics.panel.y < -1 || metrics.panel.bottom > height + 1) throw new Error(`${label}: American table leaves viewport ${JSON.stringify(metrics)}`);
            }

            await assertSingleViewport('portrait landscape-preference', page, 390, 844);
            await tableView.evaluate(el => { el.value = 'responsive'; el.dispatchEvent(new Event('change', {bubbles:true})); });
            if (await page.evaluate(() => document.body.classList.contains('preferred-landscape'))) throw new Error('Responsive selection did not restore normal layout');
            await assertSingleViewport('portrait responsive', page, 390, 844);

            const landscape = await browser.newPage({viewport:{width:844,height:390}, deviceScaleFactor:1});
            landscape.on('console', msg => { if (msg.type() === 'error') errors.push(`landscape console: ${msg.text()}`); });
            landscape.on('pageerror', err => errors.push(`landscape pageerror: ${err.message}`));
            await landscape.goto('http://127.0.0.1:4173/index.html', {waitUntil:'networkidle'});
            await landscape.locator('#americanStart').click();
            await landscape.locator('#tableView').evaluate(el => { el.value = 'landscape'; el.dispatchEvent(new Event('change', {bubbles:true})); });
            if (await landscape.locator('#americanHand .american-tile').count() !== 14) throw new Error('Landscape viewport lost the playable rack');
            await assertSingleViewport('landscape phone', landscape, 844, 390);

            const boxes = await landscape.locator('#americanPlayers .player-card').evaluateAll(els => els.map(e => { const r=e.getBoundingClientRect(); return {x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height}; }));
            if (boxes.length !== 4) throw new Error(`Expected four landscape seats, got ${boxes.length}`);
            if (Math.min(...boxes.map(b => b.width)) < 120) throw new Error(`Landscape player cards are too narrow: ${JSON.stringify(boxes)}`);
            const top = boxes.reduce((a,b) => a.y < b.y ? a : b);
            const bottom = boxes.reduce((a,b) => a.y > b.y ? a : b);
            const left = boxes.reduce((a,b) => a.x < b.x ? a : b);
            const right = boxes.reduce((a,b) => a.right > b.right ? a : b);
            if (top.x + top.width / 2 < 844 * 0.35 || top.x + top.width / 2 > 844 * 0.65) throw new Error(`Top seat is not centered: ${JSON.stringify(boxes)}`);
            if (bottom.x + bottom.width / 2 < 844 * 0.35 || bottom.x + bottom.width / 2 > 844 * 0.65) throw new Error(`Bottom seat is not centered: ${JSON.stringify(boxes)}`);
            if (left.x > 844 * 0.35 || right.right < 844 * 0.65) throw new Error(`Side seats are not positioned at the sides: ${JSON.stringify(boxes)}`);
            if (top.y > 110 || bottom.y < 390 * 0.60) throw new Error(`Top/bottom table seats are not vertically separated: ${JSON.stringify(boxes)}`);

            await landscape.close();
            if (errors.length) throw new Error(errors.join('\n'));
            await browser.close();
            console.log('American Mahjong mobile single-viewport + actionable guidance + Charleston + draw-discard + reference-style landscape regression passed');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/mahjong-server.log || true
