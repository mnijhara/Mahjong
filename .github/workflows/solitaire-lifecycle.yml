name: Solitaire Lifecycle Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0 --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          nohup python3 -m http.server 4173 --directory . >/tmp/mahjong-lifecycle-server.log 2>&1 &
          for i in {1..20}; do if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/mahjong-lifecycle-server.log
          exit 1
      - name: Exercise Solitaire lifecycle
        run: node scripts/solitaire-lifecycle-regression.js
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/mahjong-lifecycle-server.log || true
