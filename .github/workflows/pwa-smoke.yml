name: PWA Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  responsive-and-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0 --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          nohup node scripts/static-server.js >/tmp/mahjong-server.log 2>&1 &
          server_pid=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/mahjong-server.log
              exit 1
            fi
            sleep 0.5
          done
          cat /tmp/mahjong-server.log
          exit 1
      - name: Run responsive and PWA smoke suite
        run: node scripts/browser-smoke.js
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/mahjong-server.log || true
