name: PWA Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  responsive-and-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0 --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start server and run smoke suite
        run: |
          set -euo pipefail
          node scripts/static-server.js >/tmp/mahjong-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/index.html >/dev/null; then
              echo "Static server ready after ${i} attempt(s)."
              node scripts/browser-smoke.js
              exit $?
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Static server exited before becoming ready.'
              cat /tmp/mahjong-server.log
              exit 1
            fi
            sleep 0.5
          done
          echo 'Static server did not become ready within 30 seconds.'
          cat /tmp/mahjong-server.log
          exit 1
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/mahjong-server.log || true
