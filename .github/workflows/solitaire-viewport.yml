name: Solitaire Viewport Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0 --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          nohup node scripts/static-server.js 4173 >/tmp/mahjong-viewport-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/mahjong-viewport-server.log
              exit 1
            fi
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mahjong-viewport-server.log
          exit 1
      - name: Exercise viewport matrix
        run: node scripts/solitaire-viewport-regression.js
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/mahjong-viewport-server.log || true
