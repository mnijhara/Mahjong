name: Solitaire Viewport Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          nohup python3 -m http.server 4173 --directory . >/tmp/mahjong-viewport-server.log 2>&1 &
          for i in {1..20}; do if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/mahjong-viewport-server.log
          exit 1
      - name: Exercise viewport matrix
        run: node scripts/solitaire-viewport-regression.js
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/mahjong-viewport-server.log || true
